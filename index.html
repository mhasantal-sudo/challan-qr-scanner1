
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>চালান QR স্ক্যানার</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 25px auto;
      padding: 16px;
      background: #f4f7fb;
      color: #172033;
    }

    h2 { text-align: center; }

    button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
      background: #126b45;
      color: white;
      font-size: 16px;
    }

    video {
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      background: #111;
    }

    #reader {
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    #result {
      overflow-wrap: anywhere;
      background: white;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h2>চালান QR স্ক্যানার</h2>
  <p>ক্যামেরা চালু করে চালানের QR কোড স্ক্যান করুন।</p>

  <div id="reader">
    <video id="video" playsinline autoplay muted></video>
  </div>

  <p id="result">স্ক্যান করার জন্য ক্যামেরা চালু করুন।</p>

  <button onclick="startScanner()">📷 ক্যামেরা চালু করুন</button>
  <button onclick="stopScanner()">⏹ ক্যামেরা বন্ধ করুন</button>
  <button onclick="copyResult()">📋 ফলাফল কপি করুন</button>

  <script>
    let scanner = null;
    let running = false;
    let scannedText = "";
    let scanHandled = false;

   <script>
async function startScanner() {
  const result = document.getElementById("result");
  const video = document.getElementById("video");

  if (running) {
    result.textContent = "ক্যামেরা ইতিমধ্যে চালু আছে।";
    return;
  }

  if (typeof ZXing === "undefined") {
    result.textContent = "ZXing লাইব্রেরি লোড হয়নি।";
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia) {
    result.textContent = "HTTPS ওয়েবসাইটে Chrome দিয়ে খুলুন।";
    return;
  }

  try {
    result.textContent = "ক্যামেরা চালু হচ্ছে...";

    const hints = new Map();
    hints.set(
      ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.QR_CODE]
    );
    hints.set(ZXing.DecodeHintType.TRY_HARDER, false);

    scanner = new ZXing.BrowserMultiFormatReader(hints, 150);
    scanHandled = false;
    running = true;

    await scanner.decodeFromConstraints(
      {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      video,
      function(scanResult, error) {
        if (!scanResult || !running || scanHandled) return;

        scannedText = scanResult.getText().trim();

        let challanNo = "";

        try {
          const qrUrl = new URL(scannedText);
          challanNo = qrUrl.searchParams.get("challanNo") || "";
        } catch (e) {
          // QR-এ সরাসরি চালান নম্বর থাকলেও কাজ করবে
        }

        if (!challanNo) {
          const match = scannedText.match(/\b\d{4}-\d{10}\b/);
          challanNo = match ? match[0] : "";
        }

        if (!/^\d{4}-\d{10}$/.test(challanNo)) {
          result.textContent =
            "QR পড়া গেছে, কিন্তু সঠিক চালান নম্বর পাওয়া যায়নি।";
          return;
        }

        scanHandled = true;
        result.textContent = "চালান শনাক্ত হয়েছে: " + challanNo;

        stopScanner();

        const appUrl =
          "https://script.google.com/macros/s/AKfycbzcreUxsmcC98M070kHdDW9HZuno3Vse-IWFl_xx3e1EyANMYhM5aMZWwiehjYB1szhsA/exec";

        window.location.href =
          appUrl + "?challanNo=" + encodeURIComponent(challanNo);
      }
    );

    if (running) {
      result.textContent =
        "ক্যামেরা চালু। QR কোডটি ফ্রেমে ধরে স্থির রাখুন।";
    }

  } catch (error) {
    running = false;

    result.textContent =
      "ক্যামেরা চালু হয়নি: " + (error.message || error);
  }
}
    function stopScanner() {
      running = false;

      if (scanner) {
        scanner.reset();
        scanner = null;
      }
    }

    function copyResult() {
      if (!scannedText) {
        alert("আগে QR কোড স্ক্যান করুন।");
        return;
      }

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(scannedText)
          .then(function() {
            alert("QR তথ্য কপি হয়েছে।");
          })
          .catch(function() {
            prompt("QR তথ্য কপি করুন:", scannedText);
          });
      } else {
        prompt("QR তথ্য কপি করুন:", scannedText);
      }
    }
  </script>
</body>
</html>
