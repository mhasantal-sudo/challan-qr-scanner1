<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>চালান QR স্ক্যানার</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f172a; color: #fff;
    font-family: "Noto Sans Bengali", Arial, sans-serif; }
  .wrap { max-width: 560px; margin: auto; padding: 14px; }
  h1 { font-size: 19px; margin: 6px 0 12px; text-align: center; }
  .viewer { position: relative; border-radius: 14px; overflow: hidden;
    background: #000; aspect-ratio: 3 / 4; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; inset: 12%; border: 3px solid #22c55e;
    border-radius: 14px; box-shadow: 0 0 0 999px #00000055; pointer-events: none; }
  button, .btn { display: block; width: 100%; margin-top: 10px; padding: 14px;
    font-size: 16px; font-weight: bold; border: 0; border-radius: 10px;
    color: #fff; background: #176b45; text-align: center; cursor: pointer; }
  .blue { background: #2457a7; }
  .gray { background: #475569; }
  #status { margin-top: 12px; padding: 12px; border-radius: 10px;
    background: #1e293b; overflow-wrap: anywhere; line-height: 1.6; }
  #manual { width: 100%; padding: 12px; font-size: 15px; border-radius: 8px;
    border: 0; margin-top: 10px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>চালানের QR কোড স্ক্যান করুন</h1>

  <div class="viewer">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"></div>
  </div>

  <button id="startBtn" type="button">📷 ক্যামেরা চালু করুন</button>

  <label class="btn blue" for="photoInput">🖼️ ছবি তুলুন / গ্যালারি থেকে নিন</label>
  <input id="photoInput" type="file" accept="image/*" capture="environment">

  <input id="manual" type="text" placeholder="অথবা চালান নম্বর লিখুন (যেমন 2324-0008576476)">
  <button id="manualBtn" type="button" class="gray">নম্বর দিয়ে এগিয়ে যান</button>

  <div id="status">ক্যামেরা চালু করতে উপরের বোতামে চাপুন।</div>
</div>

<script>
/* ★ এখানে আপনার Apps Script Web App-এর /exec লিংক বসান ★ */
const APP_URL = 'https://script.google.com/macros/s/AKfycbzcreUxsmcC98M070kHdDW9HZuno3Vse-IWFl_xx3e1EyANMYhM5aMZWwiehjYB1szhsA/exec';

const video = document.getElementById('video');
const statusBox = document.getElementById('status');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

let stream = null;
let running = false;
let detector = null;

if ('BarcodeDetector' in window) {
  try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
}

function say(msg) { statusBox.textContent = msg; }

function bnToEn(s) {
  return String(s || '').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
}

/* QR-এর লেখা থেকে চালান নম্বর বের করা */
function extractChallanNo(text) {
  text = bnToEn(text).trim();
  let m = text.match(/\bCNO\s*:\s*([A-Za-z0-9-]+)/i);
  if (m) return m[1];
  m = text.match(/[?&]challanNo=([0-9-]+)/i);
  if (m) return m[1];
  m = text.match(/\b\d{4}-\d{10}\b/);
  if (m) return m[0];
  return null;
}

function goToApp(challanNo) {
  stopCamera();
  if (navigator.vibrate) navigator.vibrate(150);
  say('চালান নম্বর পাওয়া গেছে: ' + challanNo + '\nতথ্য ফর্মে পাঠানো হচ্ছে...');
  window.location.href = APP_URL + '?challanNo=' + encodeURIComponent(challanNo);
}

function handleDecoded(text) {
  const no = extractChallanNo(text);
  if (no) { goToApp(no); return true; }
  say('QR পড়া গেছে কিন্তু চালান নম্বর পাওয়া যায়নি।\nপাওয়া লেখা: ' + text);
  return false;
}

function stopCamera() {
  running = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

/* ভিডিও ফ্রেম থেকে QR পড়া */
async function detectFromSource(source, w, h) {
  if (detector) {
    try {
      const codes = await detector.detect(source);
      if (codes && codes.length) return codes[0].rawValue;
    } catch (e) {}
  }
  const scale = Math.min(1, 1600 / Math.max(w, h));
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const res = jsQR(img.data, img.width, img.height,
    { inversionAttempts: 'attemptBoth' });
  return res ? res.data : null;
}

async function scanLoop() {
  if (!running) return;
  if (video.readyState >= 2 && video.videoWidth) {
    const text = await detectFromSource(video, video.videoWidth, video.videoHeight);
    if (text && handleDecoded(text)) return;
  }
  setTimeout(scanLoop, 120);
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    say('এই ব্রাউজারে ক্যামেরা পাওয়া যাচ্ছে না। নিচের "ছবি তুলুন" বোতাম ব্যবহার করুন।');
    return;
  }
  try {
    stopCamera();
    say('ক্যামেরা চালু হচ্ছে...');
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    });
    video.srcObject = stream;
    await video.play();

    /* অটোফোকাস চালু করার চেষ্টা */
    try {
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
      }
    } catch (e) {}

    running = true;
    say('QR কোডটি সবুজ ফ্রেমের ভেতরে ধরুন। ফোন একটু দূরে-কাছে করে ফোকাস মেলান।');
    scanLoop();
  } catch (err) {
    say('ক্যামেরা চালু হয়নি: ' + (err.message || err) +
      '\nব্রাউজারের সেটিংসে ক্যামেরার অনুমতি দিন, অথবা "ছবি তুলুন" বোতাম ব্যবহার করুন।');
  }
}

/* ছবি তুলে/বেছে স্ক্যান: একাধিক সাইজে চেষ্টা করে */
document.getElementById('photoInput').addEventListener('change', async function (e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  say('ছবি থেকে QR পড়া হচ্ছে...');
  stopCamera();
  try {
    const bmp = await createImageBitmap(file);
    const sizes = [2400, 1600, 1000, 700];
    for (const maxSide of sizes) {
      const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
      canvas.width = w; canvas.height = h;
      ctx.drawImage(bmp, 0, 0, w, h);
      let text = null;
      if (detector) {
        try {
          const codes = await detector.detect(canvas);
          if (codes.length) text = codes[0].rawValue;
        } catch (err) {}
      }
      if (!text) {
        const img = ctx.getImageData(0, 0, w, h);
        const r = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
        if (r) text = r.data;
      }
      if (text && handleDecoded(text)) return;
      if (text) return;
    }
    say('ছবিতে QR পড়া যায়নি। QR অংশটি বড় ও স্পষ্ট করে, আলো ঠিক রেখে আবার ছবি তুলুন।');
  } catch (err) {
    say('ছবি পড়তে সমস্যা: ' + (err.message || err));
  }
  e.target.value = '';
});

document.getElementById('startBtn').addEventListener('click', startCamera);

document.getElementById('manualBtn').addEventListener('click', function () {
  const no = extractChallanNo(document.getElementById('manual').value);
  if (no) goToApp(no);
  else say('সঠিক চালান নম্বর দিন (যেমন 2324-0008576476)।');
});

/* পেজ খুলেই ক্যামেরা চালু করার চেষ্টা */
window.addEventListener('load', startCamera);
window.addEventListener('pagehide', stopCamera);
</script>
</body>
</html>
